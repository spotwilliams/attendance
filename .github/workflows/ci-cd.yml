name: Laravel CI/CD
run-name: Linting, testing and deploying Laravel app

on:
  push:
    branches: [ "upgrade/php-7.4", "workflows", "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  lint:
    name: Lint code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - run: composer install --no-interaction --no-progress
      - run: echo "Lint check passed - Laravel 5.2 uses legacy code style"
      # Note: Laravel Pint not available in Laravel 5.2, can add PHP-CS-Fixer if needed

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - run: composer install --no-interaction --no-progress
      - run: echo "Security check placeholder - add security scanner if available in composer.json"
      # Note: PHPStan may not be installed, add to composer.json if needed
      # - run: vendor/bin/phpstan analyse --level=max app/

  tests:
    name: Run tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sistema_presentismo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sail"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: sistema_presentismo
      DB_USERNAME: sail
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, xml, bcmath, zip, pdo_pgsql
      - run: composer install --no-interaction --no-progress
      - run: '[ -f .env ] || cp .env.example .env'
      - run: php artisan key:generate
      - run: php artisan migrate --force
      - run: vendor/bin/phpunit

  deploy:
    needs: [lint, security, tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')
    steps:
      - name: Deploy to Production
        run: echo "Deploying to ${{ github.ref_name }}..." # Replace with actual deploy script
        # For example, use SSH, Envoy, Forge or other deployment solutions
