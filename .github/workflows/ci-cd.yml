name: Laravel CI/CD
run-name: Linting, testing and deploying Laravel app

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:

jobs:
  lint:
    name: Lint code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: composer install --no-progress --no-suggest
      - run: ./vendor/bin/pint --test

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: composer install --no-progress --no-suggest
      - run: vendor/bin/phpstan analyse --level=max app/
      # Or use laravel security checker or other tools

  tests:
    name: Run tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, bcmath, zip, pdo_mysql
      - run: composer install --no-progress --no-suggest
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 33306
          DB_DATABASE: test_db
          DB_USERNAME: root
          DB_PASSWORD: root
      - run: vendor/bin/phpunit
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 33306
          DB_DATABASE: test_db
          DB_USERNAME: root
          DB_PASSWORD: root

  deploy:
    needs: [lint, security, tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(['main', 'develop'], github.ref_name)
    steps:
      - name: Deploy to Production
        run: echo "Deploying to production..." # Replace with actual deploy script
        # For example, use SSH, Envoy, Forge or other deployment solutions
